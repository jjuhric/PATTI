name: CI Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # BUG-5 (docs/REVIEW_2026-08-03.md): frontend/ and monitor_dashboard/ share a handful of
  # files maintained as byte-identical copies by hand (no shared workspace between the two
  # apps). This catches drift the moment a PR introduces it instead of waiting for the next
  # manual audit. No dependency install needed - the check script is pure Node.
  component-dedup-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check frontend/monitor_dashboard shared files haven't drifted
        run: npm run check:dedup

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install Project Dependencies
        run: npm run install:all
      - name: Audit root dependencies (high severity and above)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit backend dependencies (high severity and above)
        run: npm audit --omit=dev --audit-level=high --prefix backend
      - name: Audit frontend dependencies (high severity and above)
        run: npm audit --omit=dev --audit-level=high --prefix frontend

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install Project Dependencies
        run: npm run install:all
      - name: Run Backend Unit & Integration Tests
        run: npm run coverage:backend

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install Project Dependencies
        run: npm run install:all
      - name: Build Frontend Application
        run: npm run build
      - name: Run Frontend Component Tests
        run: npm run coverage:frontend

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install Project Dependencies
        run: npm run install:all
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Build Frontend Application
        run: npm run build
      - name: Run Playwright E2E Tests
        run: npm run test:e2e
